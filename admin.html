<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Triage Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .card { background: #fff; border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 6px; }
        .card h3 { margin: 0 0 10px 0; color: #e74c3c; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #3498db; color: white; border: none; padding: 10px 15px; margin-top: 15px; cursor: pointer; border-radius: 4px; font-size: 16px; }
        button:hover { background: #2980b9; }
        .success { color: green; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏥 Hospital Triage & Monitoring Dashboard</h1>
    <p>Simulate patient symptom submission and test backend communication.</p>

    <div class="card">
        <h3>Patient Symptom Simulation Form</h3>
        <form id="symptomForm">
            <label for="userId">Patient User ID:</label>
            <input type="number" id="userId" value="1" required>

            <label for="temperature">Body Temperature (°C):</label>
            <input type="number" step="0.1" id="temperature" placeholder="e.g. 38.6" required>

            <label for="symptoms">Symptoms (comma-separated):</label>
            <input type="text" id="symptoms" placeholder="e.g. cough, fever, breathing_difficulty" required>

            <button type="submit">Submit Health Update</button>
        </form>
        <div id="responseMsg" class="success"></div>
    </div>
</div>

<script>
    const form = document.getElementById('symptomForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const userId = document.getElementById('userId').value;
        const temperature = document.getElementById('temperature').value;
        const symptoms = document.getElementById('symptoms').value;

        try {
            const response = await fetch('http://127.0.0.1:5000/api/symptoms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, temperature, symptoms })
            });
            
            const data = await response.json();
            const msgDiv = document.getElementById('responseMsg');
            msgDiv.innerHTML = `<strong>Server Response:</strong> Status -> <em>${data.assigned_status}</em> | Advice -> ${data.advice}`;
        } catch (err) {
            alert('Failed to connect to Python backend. Make sure app.py is running!');
        }
    });
</script>

</body>
</html>
